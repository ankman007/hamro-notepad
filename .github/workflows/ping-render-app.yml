name: Ping Render App Every 5 mins

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl -Is https://hamro-notepad.onrender.com/ | head -n 1
          echo "Ping sent successfully!"
